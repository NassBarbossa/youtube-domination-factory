    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DBB17F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#DBB17F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)"/>
  <circle cx="1000" cy="230" r="220" fill="url(#glow)"/>
  <circle cx="1000" cy="230" r="78" fill="url(#sun)"/>
  <!-- montagnes -->

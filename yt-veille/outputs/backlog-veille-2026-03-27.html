const channels = [...new Set(DATA.map(v => v.channel))].sort();
const channelColors = {};
channels.forEach(ch => channelColors[ch] = `channel-${ch}`);

// Stats
const statsEl = document.getElementById('stats');
const totalViews = DATA.reduce((s, v) => s + v.views, 0);
const totalLikes = DATA.reduce((s, v) => s + v.likes, 0);
const outlierCount = DATA.filter(v => v.outlier).length;
const avgViews = Math.round(totalViews / DATA.length);

statsEl.innerHTML = `
  <div class="stat-card"><div class="label">Vidéos détectées</div><div class="value gold">${DATA.length}</div></div>
  <div class="stat-card"><div class="label">Vues totales</div><div class="value green">${fmt(totalViews)}</div></div>
  <div class="stat-card"><div class="label">Likes totaux</div><div class="value blue">${fmt(totalLikes)}</div></div>
  <div class="stat-card"><div class="label">Moyenne vues</div><div class="value purple">${fmt(avgViews)}</div></div>
`;

// Filters
const filtersEl = document.getElementById('filters');
let activeChannel = null;

filtersEl.innerHTML = `<button class="filter-btn active" data-ch="">Tous</button>` +
  channels.map(ch => `<button class="filter-btn" data-ch="${ch}">${ch}</button>`).join('');

filtersEl.addEventListener('click', e => {
  if (!e.target.classList.contains('filter-btn')) return;
  filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeChannel = e.target.dataset.ch || null;
  render();
});

// Search
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', () => render());

// Sort
let sortKey = 'views';
let sortDir = -1;

document.querySelectorAll('thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = key === 'title' || key === 'channel' ? 1 : -1; }
    document.querySelectorAll('thead th').forEach(t => { t.classList.remove('sorted'); t.querySelector('.arrow')?.remove(); });
    th.classList.add('sorted');
    th.insertAdjacentHTML('beforeend', `<span class="arrow">${sortDir === 1 ? '▲' : '▼'}</span>`);
    render();
  });
});

function fmt(n) {
  return n.toLocaleString('fr-FR');
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
}

function render() {
  const query = searchEl.value.toLowerCase();
  let items = DATA.filter(v => {
    if (activeChannel && v.channel !== activeChannel) return false;
    if (query && !(v.title.toLowerCase().includes(query) || v.channel.toLowerCase().includes(query))) return false;
    return true;
  });

  items.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === 'rank') { va = a._rank; vb = b._rank; }
    if (typeof va === 'string') return sortDir * va.localeCompare(vb);
    return sortDir * (va - vb);
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = items.map((v, i) => {
    const rank = i + 1;
    const isTop3 = rank <= 3;
    return `<tr>
      <td class="rank ${isTop3 ? 'top3' : ''}">${rank}</td>
      <td class="thumb-cell"><img src="${v.thumbnail}" alt="" loading="lazy"></td>
      <td class="title-cell"><a href="${v.url}" target="_blank">${v.title}</a></td>
      <td><span class="channel-badge ${channelColors[v.channel] || ''}">${v.channel}</span></td>
      <td class="num ${v.views > 50000 ? 'highlight' : ''}">${fmt(v.views)}</td>
      <td class="num">${fmt(v.likes)}</td>
      <td class="num">${fmt(v.comments)}</td>
      <td class="date-cell">${fmtDate(v.published)}</td>
      <td>${v.outlier ? '<span class="outlier-tag">OUTLIER</span>' : ''}</td>
    </tr>`;
  }).join('');
}

// Initial rank
DATA.sort((a, b) => b.views - a.views);
DATA.forEach((v, i) => v._rank = i + 1);
render();
</script>

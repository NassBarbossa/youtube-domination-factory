<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Convergence — Écran de fin</title>
<link rel="stylesheet" href="convergence.css">
<style>
.center{position:absolute;inset:80px 0 76px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px;text-align:center;}
.center .wm{font-size:104px;}
.k{font-family:var(--mono);font-size:24px;letter-spacing:.3em;color:var(--or);font-weight:600;}
.t{font-weight:700;font-size:72px;letter-spacing:-.02em;margin-top:-18px;}
.s{font-family:var(--mono);font-size:20px;color:var(--gris);letter-spacing:.12em;}
</style></head>
<body>
<!-- Source navigateur OBS : 1920 × 1080 -->
<div class="gridbg"></div>
<div class="topbar"><span>FIN DU LIVE</span><span>REPLAY SUR YOUTUBE</span></div>
<div class="center">
  <span data-wm="anim"></span>
  <span class="k">PROCHAINE CONVERGENCE</span>
  <span class="t">Même heure, la semaine pro.</span>
  <span class="s">ABONNE-TOI · ACTIVE LA CLOCHE</span>
</div>
<div class="ticker"><div class="ticker-track"></div></div>
<script src="convergence.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Convergence — Carte de sujet</title>
<link rel="stylesheet" href="convergence.css">
<style>
.topic{position:absolute;inset:80px 0 76px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center;padding:0 120px;}
.num{font-family:var(--mono);font-size:26px;letter-spacing:.32em;color:var(--vert);font-weight:600;}
.ttl{font-weight:800;font-size:124px;line-height:.98;letter-spacing:-.03em;max-width:1500px;opacity:0;transform:translateY(30px);animation:in .8s cubic-bezier(.2,.8,.2,1) .1s forwards;}
.ttl.long{font-size:96px;}
.ttl em{font-style:normal;color:var(--or);}
@keyframes in{to{opacity:1;transform:none;}}
.bar{width:640px;height:7px;display:flex;}
.bar i{flex:1;background:var(--or);transform:scaleX(0);transform-origin:left;animation:grow .9s cubic-bezier(.65,0,.35,1) .3s forwards;}
.bar i+i{background:var(--vert);transform-origin:right;}
@keyframes grow{to{transform:scaleX(1);}}
.chips{display:flex;gap:18px;font-family:var(--mono);font-size:22px;}
.chip{border:1px solid var(--trait);background:var(--carte);padding:10px 20px;border-radius:4px;letter-spacing:.08em;}
/* Carte « trade de la semaine » */
.trade{display:none;gap:18px;font-family:var(--mono);opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) .6s forwards;}
.trade.on{display:flex;}
.tcell{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:220px;padding:22px 30px;border-radius:10px;background:var(--carte);border:1px solid var(--trait);}
.tcell small{font-size:18px;letter-spacing:.22em;color:var(--gris);font-weight:600;}
.tcell b{font-family:var(--sans);font-size:44px;font-weight:700;letter-spacing:-.01em;}
.tcell.sens b{color:#fff;font-family:var(--mono);font-size:30px;letter-spacing:.14em;padding:4px 16px;border-radius:6px;background:var(--vert);}
.tcell.sens.vente b{background:var(--rouge);}
.tcell.obj b{color:var(--vert);} .tcell.inv b{color:var(--rouge);}
.disc{font-family:var(--mono);font-size:16px;color:var(--gris);letter-spacing:.1em;display:none;}
.disc.on{display:block;}
</style></head>
<body>
<!-- Source navigateur OBS : 1920 × 1080.
     Le contenu vient de obs/sujets.js : ?n=1 affiche le 1er sujet, ?n=2 le 2e, etc.
     (Ancienne méthode toujours possible : ?n=2&total=5&titre=…&mot=…&tags=…) -->
<div class="gridbg"></div>
<div class="topbar"><span class="live">LIVE</span><span data-wm=""></span><span>SUJET <span id="n2">01</span> / <span id="tot">01</span></span></div>
<div class="topic">
  <span class="num" id="kick">TENDANCE N°1</span>
  <span class="ttl" id="ttl">Sujet à remplir dans sujets.js</span>
  <span class="bar"><i></i><i></i></span>
  <div class="chips" id="tags"></div>
  <div class="trade" id="trade"></div>
  <span class="disc" id="disc">CECI N'EST PAS UN CONSEIL EN INVESTISSEMENT</span>
</div>
<div class="ticker"><div class="ticker-track"></div></div>
<script src="convergence.js"></script>
<script src="sujets.js"></script>
<script>
const p = new URLSearchParams(location.search);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const n = parseInt(p.get('n') || '1', 10);
const list = window.SUJETS || [];
let S = list[n - 1];
if (p.get('titre')) S = { type: 'TENDANCE', titre: p.get('titre'), mot: p.get('mot'), tags: (p.get('tags') || '').split(',').filter(Boolean) };
const total = p.get('total') || list.length || 1;

document.getElementById('n2').textContent = String(n).padStart(2, '0');
document.getElementById('tot').textContent = String(total).padStart(2, '0');

if (S) {
  // Sur-titre : les TENDANCES sont numérotées entre elles
  if ((S.type || 'TENDANCE').toUpperCase() === 'TENDANCE') {
    const rang = list.slice(0, n).filter(x => (x.type || 'TENDANCE').toUpperCase() === 'TENDANCE').length || n;
    document.getElementById('kick').textContent = 'TENDANCE N°' + rang;
  } else {
    document.getElementById('kick').textContent = S.type.toUpperCase();
  }
  const t = esc(S.titre || '');
  const ttl = document.getElementById('ttl');
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const motRe = S.mot ? new RegExp('(^|[^\\p{L}])(' + escRe(esc(S.mot)) + ')(?=[^\\p{L}]|$)', 'u') : null;
  ttl.innerHTML = motRe ? t.replace(motRe, '$1<em>$2</em>') : t;
  if ((S.titre || '').length > 34) ttl.classList.add('long');
  document.getElementById('tags').innerHTML = (S.tags || []).map(x => `<span class="chip">${esc(x)}</span>`).join('');
  if (S.style === 'trade' && S.trade) {
    const T = S.trade, vente = /vente|short/i.test(T.sens || '');
    const tr = document.getElementById('trade');
    tr.innerHTML =
      `<div class="tcell"><small>ACTIF</small><b>${esc(T.actif || '')}</b></div>` +
      `<div class="tcell sens ${vente ? 'vente' : ''}"><small>SENS</small><b>${esc(T.sens || '')}</b></div>` +
      `<div class="tcell"><small>ENTRÉE</small><b>${esc(T.entree || '')}</b></div>` +
      `<div class="tcell obj"><small>OBJECTIF</small><b>${esc(T.objectif || '')}</b></div>` +
      `<div class="tcell inv"><small>INVALIDATION</small><b>${esc(T.invalidation || '')}</b></div>`;
    tr.classList.add('on');
    document.getElementById('disc').classList.add('on');
  }
}
</script>
</body></html>

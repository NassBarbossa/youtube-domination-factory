<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Convergence — Écran live 2 caméras</title>
<link rel="stylesheet" href="convergence.css">
<style>
.frame{position:absolute;inset:0;}
.cam{position:absolute;top:104px;width:710px;height:856px;border-radius:14px;}
.cam.a{left:46px;border:4px solid var(--or);} .cam.v{left:780px;border:4px solid var(--vert);}
.tagc{position:absolute;left:24px;bottom:24px;padding:10px 18px;border-radius:4px;font-family:var(--mono);font-weight:600;letter-spacing:.12em;font-size:20px;color:#fff;}
.cam.a .tagc{background:var(--or);} .cam.v .tagc{background:var(--vert);}
.name{position:absolute;left:24px;bottom:76px;font-weight:700;font-size:30px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45);}
.side{position:absolute;left:1514px;top:104px;width:360px;height:856px;display:flex;flex-direction:column;gap:24px;}
.panel{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:28px;font-family:var(--mono);font-size:20px;}
.panel.brand{flex:1;display:flex;align-items:center;justify-content:center;}
.panel.brand .wm{font-size:28px;}
.ph{color:var(--or);letter-spacing:.18em;margin-bottom:16px;font-weight:600;}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--trait);}
</style></head>
<body class="transparent">
<!-- Source navigateur OBS : 1920 × 1080, à placer AU-DESSUS des deux caméras.
     Le fond est percé de deux fenêtres transparentes :
       Caméra co-host : x = 50,  y = 108, 702 × 848
       Caméra Nass    : x = 784, y = 108, 702 × 848
     Paramètres : ?ep=01&cohost=Prénom&nass=Nass
     Le panneau « Cette semaine » et le bandeau se remplissent tout seuls avec « Lancer les cours en direct.bat ». -->
<svg class="frame" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="g" width="96" height="96" patternUnits="userSpaceOnUse"><path d="M96 0H0V96" fill="none" stroke="#E6E1D6" stroke-width="1"/></pattern>
    <clipPath id="holes"><path clip-rule="evenodd" d="M0 0H1920V1080H0Z M60 104h682a14 14 0 0 1 14 14v828a14 14 0 0 1-14 14H60a14 14 0 0 1-14-14V118a14 14 0 0 1 14-14Z M794 104h682a14 14 0 0 1 14 14v828a14 14 0 0 1-14 14H794a14 14 0 0 1-14-14V118a14 14 0 0 1 14-14Z"/></clipPath>
  </defs>
  <g clip-path="url(#holes)"><rect width="1920" height="1080" fill="#F2EFE8"/><rect width="1920" height="1080" fill="url(#g)"/></g>
</svg>
<div class="topbar"><span class="live">LIVE</span><span data-wm=""></span><span>ÉP. <span data-param="ep">01</span> · TENDANCES DE LA SEMAINE</span></div>
<div class="cam a"><span class="name" data-param="cohost">CO-HOST</span><span class="tagc">MARCHÉS · OR</span></div>
<div class="cam v"><span class="name" data-param="nass">NASS</span><span class="tagc">CRYPTO</span></div>
<div class="side">
  <div class="panel brand"><span data-wm="anim"></span></div>
  <div class="panel"><div class="ph">CETTE SEMAINE</div><div id="maj" style="font-size:15px;color:var(--gris);letter-spacing:.08em;margin:-8px 0 8px"></div>
    <div id="semaine">
      <div class="row"><span>OR</span><span>—</span></div>
      <div class="row"><span>S&amp;P 500</span><span>—</span></div>
      <div class="row"><span>BTC</span><span>—</span></div>
      <div class="row"><span>SOL</span><span>—</span></div>
    </div>
  </div>
</div>
<div class="ticker"><div class="ticker-track"></div></div>
<script src="convergence.js"></script>
</body></html>

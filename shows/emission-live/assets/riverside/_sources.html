<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Convergence — sources des visuels Riverside</title>
<link rel="stylesheet" href="../obs/convergence.css">
<style>
/* ?v=fond | overlay | cam-cohost | cam-nass | logo-editeur */
.v{display:none;position:absolute;inset:0;}
.lines{position:absolute;inset:0;width:100%;height:100%;}
/* fond studio */
#fond .mark{position:absolute;right:56px;bottom:46px;}
#fond .mark .wm{font-size:30px;}
/* overlay */
#overlay .topbar{justify-content:space-between;}
#overlay .topbar .wm{font-size:28px;}
.ep{font-family:var(--mono);font-size:21px;color:var(--gris);letter-spacing:.08em;}
.ticker-track{animation:none!important;}
/* fonds caméra */
.cam{background:var(--papier);}
.cam .glow{position:absolute;inset:0;}
.cam .bigv{position:absolute;right:-60px;top:50%;transform:translateY(-50%);height:1100px;opacity:.08;}
.cam .brand{position:absolute;top:52px;right:60px;} .cam .brand .wm{font-size:30px;}
.cam .role{position:absolute;top:100px;right:60px;font-family:var(--mono);font-size:18px;letter-spacing:.24em;font-weight:600;}
/* logo éditeur 128 x 72 */
#logoed{background:transparent;}
</style></head>
<body class="transparent">

<div class="v" id="fond" style="background:var(--papier)">
  <div class="gridbg"></div>
  <svg class="lines" viewBox="0 0 1920 1080" preserveAspectRatio="none"><polyline points="0,900 480,800 960,540 1440,330 1920,180" fill="none" stroke="#C98A0B" stroke-width="5" opacity=".28"/><polyline points="0,190 480,320 960,540 1440,760 1920,880" fill="none" stroke="#0F8A5F" stroke-width="5" opacity=".28"/></svg>
  <div class="mark"><span data-wm=""></span></div>
</div>

<div class="v" id="overlay">
  <div class="topbar"><span data-wm=""></span><span class="ep">ÉP. <span data-param="ep">01</span> · TENDANCES DE LA SEMAINE</span></div>
  <div class="ticker"><div class="ticker-track"></div></div>
</div>

<div class="v cam" id="cam-cohost">
  <div class="gridbg" style="opacity:.6"></div>
  <svg class="glow" viewBox="0 0 1920 1080" preserveAspectRatio="none"><defs><radialGradient id="ga" cx="85%" cy="40%" r="60%"><stop offset="0" stop-color="#C98A0B" stop-opacity=".22"/><stop offset="1" stop-color="#C98A0B" stop-opacity="0"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#ga)"/></svg>
  <svg class="bigv" viewBox="0 0 60 64"><line x1="5" y1="5" x2="30" y2="58" stroke="#C98A0B" stroke-width="9" stroke-linecap="round"/><line x1="55" y1="5" x2="30" y2="58" stroke="#0F8A5F" stroke-width="9" stroke-linecap="round"/></svg>
  <div class="brand"><span data-wm=""></span></div>
  <div class="role" style="color:var(--or)">MARCHÉS · OR</div>
</div>

<div class="v cam" id="cam-nass">
  <div class="gridbg" style="opacity:.6"></div>
  <svg class="glow" viewBox="0 0 1920 1080" preserveAspectRatio="none"><defs><radialGradient id="gv" cx="85%" cy="40%" r="60%"><stop offset="0" stop-color="#0F8A5F" stop-opacity=".2"/><stop offset="1" stop-color="#0F8A5F" stop-opacity="0"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#gv)"/></svg>
  <svg class="bigv" viewBox="0 0 60 64"><line x1="5" y1="5" x2="30" y2="58" stroke="#C98A0B" stroke-width="9" stroke-linecap="round"/><line x1="55" y1="5" x2="30" y2="58" stroke="#0F8A5F" stroke-width="9" stroke-linecap="round"/></svg>
  <div class="brand"><span data-wm=""></span></div>
  <div class="role" style="color:var(--vert)">CRYPTO</div>
</div>

<div class="v" id="logoed" style="width:128px;height:72px;inset:auto;left:0;top:0;">
  <svg width="128" height="72" viewBox="0 0 128 72"><rect x="34" y="6" width="60" height="60" rx="14" fill="#0B0E11"/><line x1="50" y1="19" x2="64" y2="52" stroke="#E2A93B" stroke-width="6.5" stroke-linecap="round"/><line x1="78" y1="19" x2="64" y2="52" stroke="#2BB37C" stroke-width="6.5" stroke-linecap="round"/></svg>
</div>

<script src="../obs/convergence.js"></script>
<script>
const v = new URLSearchParams(location.search).get('v') || 'fond';
document.getElementById(v).style.display = 'block';
</script>
</body></html>

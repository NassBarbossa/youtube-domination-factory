<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Convergence — Gabarit miniature 1280 × 720</title>
<style>
@font-face{font-family:'Inter Tight';src:url('../fonts/InterTight-var.ttf');font-weight:100 900;}
@font-face{font-family:'IBM Plex Mono';src:url('../fonts/IBMPlexMono-SemiBold.ttf');font-weight:600;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1280px;height:720px;overflow:hidden;}
body{background:#F2EFE8;position:relative;font-family:'Inter Tight',sans-serif;color:#0B0E11;}
.grid{position:absolute;inset:0;background-image:linear-gradient(#E6E1D6 1px,transparent 1px),linear-gradient(90deg,#E6E1D6 1px,transparent 1px);background-size:52px 52px;}
.face{position:absolute;bottom:0;width:400px;height:610px;border-radius:18px 18px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#6B7280;font-family:'IBM Plex Mono',monospace;font-size:16px;text-align:center;}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;}
.face.a{left:24px;background:linear-gradient(180deg,rgba(201,138,11,.22),rgba(201,138,11,.05));border:5px solid #C98A0B;border-bottom:none;}
.face.v{right:24px;background:linear-gradient(180deg,rgba(15,138,95,.2),rgba(15,138,95,.04));border:5px solid #0F8A5F;border-bottom:none;}
.hl{position:absolute;left:424px;right:424px;top:70px;bottom:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;}
.big{font-weight:800;font-size:74px;line-height:.95;letter-spacing:-.03em;}
.num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:48px;white-space:nowrap;}
.up{color:#0F8A5F;} .dn{color:#C8323F;} .au{color:#C98A0B;}
.ep{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);background:#0B0E11;padding:12px 22px;border-radius:6px;display:flex;align-items:center;gap:16px;}
.ep img{height:22px;}
.ep span{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;letter-spacing:.2em;color:#9AA3AD;}
</style></head>
<body>
<!-- Gabarit miniature. Paramètres :
     ?l1=Or vs&l2=Bitcoin&chiffre1=+6 %&chiffre2=−2 %&ep=01&photo1=photos/cohost.png&photo2=photos/nass.png
     Les photos (détourées, PNG transparent) se placent dans le dossier youtube/photos/. -->
<div class="grid"></div>
<div class="face a" id="fa">PHOTO<br>CO-HOST</div>
<div class="face v" id="fv">PHOTO<br>NASS</div>
<div class="hl">
  <span class="big"><span id="l1">Or vs</span><br><span id="l2">Bitcoin</span></span>
  <span class="num"><span class="up" id="c1">+6 %</span> / <span class="dn" id="c2">−2 %</span></span>
</div>
<div class="ep"><img src="../logo/convergence-logo-sombre.svg" alt="Convergence"><span>ÉP. <span id="ep">01</span></span></div>
<script>
const p = new URLSearchParams(location.search);
['l1', 'l2', 'ep'].forEach(k => { if (p.get(k)) document.getElementById(k).textContent = p.get(k); });
[['chiffre1', 'c1'], ['chiffre2', 'c2']].forEach(([k, id]) => {
  const v = p.get(k); if (!v) return;
  const el = document.getElementById(id); el.textContent = v;
  el.className = /^[−-]/.test(v.trim()) ? 'dn' : 'up';
});
[['photo1', 'fa'], ['photo2', 'fv']].forEach(([k, id]) => {
  if (p.get(k)) document.getElementById(id).innerHTML = `<img src="${p.get(k)}" alt="">`;
});
</script>
</body></html>

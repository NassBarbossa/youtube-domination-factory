    <script>

      let seed = 33;
      const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

      // ---------- pixel art ----------
      const PAL = { K: '#0B0B0B', S: '#DBB17F', L: '#F3D6A8', D: '#9C7748', C: '#F4EFE7', B: '#648596', b: '#4F6C7B', G: '#3B3A37', g: '#9A968D', W: '#FFFFFF' };
      const sprite = (rows, P, extra = '') => {
        const w = rows[0].length * P, h = rows.length * P; let r = '';

      };
      const COIN = ['..KKKK..', '.KSSSSK.', 'KSLSSDSK', 'KSLSSDSK', 'KSLSSDSK', 'KSLSSDSK', '.KSSSSK.', '..KKKK..'];
      const KEY = ['.KKKK.........', 'KLSSSK........', 'KSKKSKKKKKKKKK', 'KSKKSSSSSSSSSK', 'KSSSSKKKKSKKSK', '.KKKK....KK.KK'];

      document.getElementById('qblock').innerHTML = sprite(QB, 14);
      document.getElementById('ccoin').innerHTML = sprite(COIN, 6);
      document.getElementById('hearts').innerHTML = [0, 1, 2].map(i => `<span style="position:relative;width:56px;height:48px"><span id="hf${i}" style="position:absolute">${sprite(HEART, 8)}</span><span id="he${i}" style="position:absolute;opacity:0">${sprite(HEART0, 8)}</span></span>`).join('');

      let g = ''; for (let x = 0; x < 3400; x += 96) g += `<div style="position:absolute;left:${x}px;top:1700px">${sprite(BRICK, 12)}</div><div style="position:absolute;left:${x}px;top:1796px">${sprite(BRICK, 12)}</div>`;
      document.getElementById('ground').innerHTML = g;
      let st = ''; for (let i = 0; i < 70; i++) st += `<div class="star" style="left:${(rnd() * 3400).toFixed(0)}px;top:${(rnd() * 1300).toFixed(0)}px;opacity:${(0.2 + rnd() * 0.6).toFixed(2)}"></div>`;
      document.getElementById('stars').innerHTML = st;
      // blockchain : 5 blocs reliés
      const BX = [260, 460, 660, 860, 1060];
      document.getElementById('chain').innerHTML = BX.map((x, i) => `<div class="blk" id="b${i}" style="position:absolute;left:${x}px;top:980px">${sprite(BRICK, 12)}</div>` +

      document.getElementById('cnum').innerHTML = Array.from({ length: 13 }, (_, n) => `<span class="cn" id="cn${n}" style="position:absolute;left:0;top:0;opacity:${n === 12 ? 1 : 0}">${String(n).padStart(4, '0')}</span>`).join('');

      // ---------- corps animé du punk (même grille que la tête : 1 pixel = 9 px) ----------

      const TORSO_UP = TORSO.map((r, i) => (i >= 1 && i <= 6) ? '.K' + r.slice(2) : r);
      const LEGS = {
        idle: ['..KQQQKKQQQK..', '..KQQQKKQQQK..', '..KQQQKKQQQK..', '..KQQQKKQQQK..', '.KSSSSKKSSSSK.', '.KKKKKKKKKKKK.'],

        jump: ['..KQQQKKQQQK..', '.KQQQQKKQQQQK.', 'KQQQQK..KQQQQK', 'KSSSK....KSSSK', 'KKKK......KKKK', '..............'],
      };
      const ARM = ['KKK', 'KEK', 'KEK'].concat(Array(18).fill('KJK'));
      const buildPunk = (id) => {
        const fr = (cls, rows) => `<div class="fr f-${cls}">${sprite(rows, 9)}</div>`;

          `<div class="bod">${fr('idle', TORSO.concat(LEGS.idle))}${fr('a', TORSO.concat(LEGS.a))}${fr('b', TORSO.concat(LEGS.b))}${fr('jump', TORSO.concat(LEGS.jump))}${fr('up', TORSO_UP.concat(LEGS.idle))}</div>`;
      };
      buildPunk('punk'); buildPunk('punk2');
      // gerbes de pixels (style vidéo Reeaach)
      const FX = document.getElementById('fx');
      function makeBurst(p, n, r, cols) {
        const parts = [];
        for (let i = 0; i < n; i++) {
          const s = document.createElement('div'); s.className = 'spark'; s.style.left = p.x + 'px'; s.style.top = p.y + 'px'; s.style.background = cols[i % cols.length];

        }
        return parts;
      }

      const SP = document.getElementById('spill');
      for (let i = 0; i < 10; i++) SP.insertAdjacentHTML('beforeend', `<div class="sc" style="position:absolute;left:690px;top:1560px" data-x="${(250 + rnd() * 500).toFixed(0)}" data-y="${(-300 - rnd() * 500).toFixed(0)}">${sprite(COIN, 7)}</div>`);
      // éclats de la clé
      const SH = document.getElementById('shards');
      for (let i = 0; i < 6; i++) SH.insertAdjacentHTML('beforeend', `<div class="sh" style="position:absolute;left:${380 + i * 18}px;top:1650px;width:24px;height:24px;background:${i % 2 ? '#DBB17F' : '#F3D6A8'};border:4px solid #0B0B0B" data-x="${((rnd() - .5) * 400).toFixed(0)}" data-y="${(-150 - rnd() * 200).toFixed(0)}"></div>`);

      // ---------- sous-titres : boîte de dialogue, mots qui s'écrivent au rythme de la voix ----------
      const SENT = [
        ["Ta crypto n'est pas dans ton wallet.", 0, []],
        ["Elle est sur la blockchain.", 1, ['blockchain.']],
        ["Ton wallet, lui, garde la clé qui permet de la bouger.", 1, ['clé']],
        ["Perds la clé, tu perds tout.", 1, ['tout.']],
        ["Donne-la, on te vide.", 1, ['vide.']],
        ["Et sur un exchange ?", 1, ['exchange']],
        ["C'est eux qui gardent la clé, pas toi.", 1, ['toi.']],
        ["Pas tes clés, pas tes cryptos.", 0, []],
        ["Formation offerte, lien en bio.", 0, []],
      ];
      let wi = 0; const LINES = document.getElementById('lines'); const sents = [];
      SENT.forEach(([txt, show, keys], si) => {
        const toks = txt.split(' '); let html = '', k = 0;
        const n = txt.replace(/ \?/, '').split(' ').length; const ws = WORDS.slice(wi, wi + n); wi += n;
        toks.forEach(tk => { if (tk === '?') { html += ' <i id="q' + si + '">?</i>'; return; } html += (k ? ' ' : '') + `<i id="w${si}_${k}"${keys.includes(tk) ? ' class="k"' : ''}>${tk}</i>`; k++; });
        LINES.insertAdjacentHTML('beforeend', `<div class="line" id="L${si}">${html}</div>`);
        sents.push({ si, show, ws, end: ws[ws.length - 1].t + ws[ws.length - 1].d, hasQ: txt.includes(' ?') });
      });

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      const cam = (x, y) => ({ x: -x, y: -y });
      gsap.set('#cam-inner', cam(560, 1420)); gsap.set('#cam-outer', { scale: 1.15 });
      gsap.set(['.blk', '.lk', '#coinWrap', '#trail', '#qb', '#key', '#hacker', '.sc', '.sh', '#rays', '#qblock', '#castle', '#key2', '#punk2', '#xb', '.spark', '.kin'], { opacity: 0 });
      gsap.set('#key', { x: 0, y: 0 });

      const blink = (sel, t, n = 3) => { for (let i = 0; i < n; i++) { tl.set(sel, { opacity: 0 }, t + i * 0.12); tl.set(sel, { opacity: 1 }, t + i * 0.12 + 0.06); } };
      const pose = (sel, f, t) => { tl.set(sel + ' .fr', { opacity: 0 }, t); tl.set(sel + ' .f-' + (f === 'up' ? 'up' : f), { opacity: 1 }, t); tl.set(sel + ' .arm', { opacity: f === 'up' ? 1 : 0 }, t); };
      const walk = (sel, t0, t1) => { for (let t = t0, i = 0; t < t1; t += 0.11, i++) pose(sel, i % 2 ? 'b' : 'a', t); pose(sel, 'idle', t1); };
      const playBurst = (parts, t) => parts.forEach((s, i) => tl.fromTo(s, { opacity: 1, x: 0, y: 0, scale: +s.dataset.s }, { opacity: 0, x: +s.dataset.x, y: +s.dataset.y, scale: 0.3, duration: 0.7 + (i % 4) * 0.08, ease: 'expo.out', immediateRender: false }, t));
      const whip = (t, x, y, s, r, d = 0.34) => {
        tl.to('#cam-inner', { ...cam(x, y), duration: d, ease: 'expo.inOut' }, t);
        tl.to('#cam-outer', { scale: s, rotation: r, duration: d, ease: 'expo.inOut' }, t);
        tl.to('#world', { keyframes: [{ filter: 'blur(9px)', duration: d * 0.45 }, { filter: 'blur(0px)', duration: d * 0.55 }] }, t);
      };
      const shake = (t, a = 14) => tl.to('#cam-outer', { keyframes: [{ x: -a, y: a / 2, duration: 0.04 }, { x: a * 0.8, y: -a / 2, duration: 0.04 }, { x: -a / 2, y: a / 4, duration: 0.04 }, { x: 0, y: 0, duration: 0.05 }] }, t);
      const showN = (v, t) => { tl.set('.cn', { opacity: 0 }, t); tl.set('#cn' + v, { opacity: 1 }, t); };
      const counter = (t0, t1, from, to) => { const n = Math.abs(from - to); for (let i = 0; i <= n; i++) showN(from + (to > from ? i : -i), t0 + (t1 - t0) * i / n); };
      const slamIn = (id, t, mode) => {
        if (mode === 'scale') tl.fromTo(id, { opacity: 0, scale: 2.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'power4.out', immediateRender: false }, t);
        else tl.fromTo(id, { opacity: 0, x: mode * 900 }, { opacity: 1, x: 0, duration: 0.22, ease: 'power4.out', immediateRender: false }, t);
      };

      pose('#punk', 'idle', 0); pose('#punk2', 'idle', 0);
      // respiration au repos : la tête monte d'un pixel toutes les 0,5 s
      for (let t = 1.1, i = 0; t < 22.5; t += 0.5, i++) { tl.set('#punk .head', { y: i % 2 ? 0 : 9 }, t); tl.set('#punk2 .head', { y: i % 2 ? 9 : 0 }, t); }
      pose('#punk', 'jump', 5.8); pose('#punk', 'up', 5.96);              // saute et brandit la clé
      pose('#punk', 'jump', 8.25); pose('#punk', 'idle', 8.6);            // la clé lui échappe
      pose('#punk', 'up', 10.0); pose('#punk', 'idle', 10.6);             // la reprend, puis la donne
      pose('#punk', 'jump', 10.95); pose('#punk', 'idle', 11.25);         // sursaute quand le coffre se vide
      pose('#punk2', 'jump', 15.55); pose('#punk2', 'idle', 15.82);       // se cogne à la grille
      // étoiles qui scintillent (pas de 0,25 s)
      document.querySelectorAll('.star').forEach((s, i) => { if (i % 3 === 0) for (let t = (i % 7) * 0.2; t < 22.5; t += 1.4) { tl.set(s, { opacity: 0.15 }, t); tl.set(s, { opacity: 0.85 }, t + 0.7); } });
      // dialogue
      tl.fromTo('#dlg', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, 2.3);
      tl.to('#dlg', { opacity: 0, y: 60, duration: 0.2 }, 16.55);
      blink('#dlgArrow', 2.6, 60);
      sents.forEach(({ si, show, ws, end, hasQ }) => {
        if (!show) return;
        tl.set('#L' + si, { opacity: 1 }, ws[0].t - 0.05);
        ws.forEach((w, k) => tl.set(`#w${si}_${k}`, { opacity: 1 }, w.t));
        if (hasQ) tl.set('#q' + si, { opacity: 1 }, end);
        const next = sents.find(x => x.si > si && x.show);
        tl.set('#L' + si, { opacity: 0 }, next ? next.ws[0].t - 0.06 : end + 0.5);
      });

      // ===== 0 → 2,2 : HOOK =====
      slamIn('#h1', 0.08, -1); slamIn('#h2', 0.6, 'scale'); slamIn('#h3', 0.87, 1);
      tl.to('#root', { keyframes: [{ scale: 1.07, duration: 0.06 }, { scale: 1, duration: 0.28, ease: 'power3.out' }] }, 0.73);
      tl.to('#cam-outer', { scale: 1.25, duration: 2.1, ease: 'power1.inOut' }, 0);
      walk('#punk', 0.1, 1.0);
      tl.to('#lid', { y: -40, x: -20, rotation: -14, duration: 0.18, ease: 'back.out(3)' }, 1.13);
      tl.set('#inside', { opacity: 1 }, 1.13);
      tl.fromTo('#qb', { opacity: 0, scale: 0.2, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, 1.4);
      tl.to(['#h1', '#h2', '#h3'], { opacity: 0, y: -80, duration: 0.16, ease: 'power3.in', stagger: 0.03 }, 2.08);
      tl.to('#qb', { opacity: 0, duration: 0.12 }, 2.15);

      // ===== 2,2 : whip vers la blockchain =====
      whip(2.2, 700, 900, 1.2, -3);
      tl.to('#lid', { y: 0, x: 0, rotation: 0, duration: 0.1 }, 2.3); tl.set('#inside', { opacity: 0 }, 2.3);
      BX.forEach((_, i) => tl.fromTo('#b' + i, { opacity: 0, y: -260 }, { opacity: 1, y: 0, duration: 0.3, ease: 'bounce.out', immediateRender: false }, 2.4 + i * 0.09));
      [1, 2, 3, 4].forEach(i => tl.fromTo('#lk' + i, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, transformOrigin: '0 50%', duration: 0.12, immediateRender: false }, 2.62 + i * 0.07));
      tl.fromTo('#coinWrap', { opacity: 0, y: -200 }, { opacity: 1, y: 0, duration: 0.3, ease: 'bounce.out', immediateRender: false }, 2.88);
      playBurst(burstCoin, 3.0);
      for (let t = 3.1, i = 0; t < 8.6; t += 0.1, i++) tl.set('#coin', { scaleX: [1, 0.6, 0.15, 0.6][i % 4] }, t);   // pièce qui tourne en 4 images

      // ===== 4,1 : retour au coffre, la clé sort, le punk l'attrape =====
      whip(4.1, 560, 1440, 1.3, 2);
      tl.to('#lid', { y: -48, x: -24, rotation: -18, duration: 0.2, ease: 'back.out(3)' }, 4.45); tl.set('#inside', { opacity: 1 }, 4.45);
      tl.fromTo('#key', { opacity: 1, y: 40, scale: 0.6 }, { opacity: 1, y: -180, scale: 1.2, duration: 0.45, ease: 'back.out(2)', immediateRender: false }, 5.5);
      tl.to('#key', { y: -170, duration: 0.1, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 5.75);
      tl.to('#punk', { keyframes: [{ y: -150, duration: 0.16, ease: 'power2.out' }, { y: 0, duration: 0.16, ease: 'power2.in' }] }, 5.8);
      tl.to('#key', { x: -407, y: -251, scale: 1.35, rotation: -12, duration: 0.24, ease: 'power3.out' }, 5.96);   // clé brandie au-dessus de la tête
      tl.fromTo('#rays', { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: 60, duration: 0.5, ease: 'expo.out', immediateRender: false }, 5.98);
      tl.to('#rays', { rotation: 120, duration: 0.5, ease: 'none' }, 6.48);
      playBurst(burstKey, 6.0);
      shake(6.0, 8);
      // zoom arrière : la clé commande la pièce sur la blockchain
      tl.to('#cam-inner', { ...cam(700, 1280), duration: 0.5, ease: 'expo.inOut' }, 6.25);
      tl.to('#cam-outer', { scale: 0.64, rotation: 0, duration: 0.5, ease: 'expo.inOut' }, 6.25);
      tl.to('#rays', { opacity: 0, duration: 0.3 }, 6.5);
      tl.set('#trailP', { attr: { points: '313,1300 380,1150 560,1040 700,990' } }, 6.3);
      tl.fromTo('#trail', { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, 6.35);
      tl.fromTo('#trailP', { strokeDashoffset: 0 }, { strokeDashoffset: -128, duration: 1.2, ease: 'none', immediateRender: false }, 6.35);
      tl.to('#coinWrap', { keyframes: [{ x: 100, y: -170, duration: 0.18, ease: 'power2.out' }, { x: 200, y: 0, duration: 0.2, ease: 'power2.in' }] }, 6.78);

      // ===== 7,7 : perds la clé, tu perds tout =====
      tl.to('#cam-inner', { ...cam(470, 1460), duration: 0.3, ease: 'expo.inOut' }, 7.7);
      tl.to('#cam-outer', { scale: 1.35, rotation: -2, duration: 0.3, ease: 'expo.inOut' }, 7.7);
      tl.to('#trail', { opacity: 0, duration: 0.15 }, 7.7);
      tl.to('#key', { keyframes: [{ rotation: -30, duration: 0.06 }, { rotation: 10, duration: 0.06 }, { rotation: -20, duration: 0.06 }] }, 8.25);
      tl.to('#key', { x: -260, y: 80, rotation: 160, duration: 0.42, ease: 'power2.in' }, 8.42);
      tl.set('#key', { opacity: 0 }, 8.86);
      tl.set('.sh', { opacity: 1 }, 8.86);
      document.querySelectorAll('.sh').forEach(s => tl.fromTo(s, { x: 0, y: 0, rotation: 0 }, { x: +s.dataset.x, y: +s.dataset.y, rotation: 200, duration: 0.6, ease: 'power2.out', immediateRender: false }, 8.86));
      tl.to('.sh', { opacity: 0, duration: 0.2 }, 9.4);
      playBurst(burstBreak, 8.87);
      shake(8.87, 18);
      tl.to('#flash', { keyframes: [{ opacity: 0.6, duration: 0.03 }, { opacity: 0, duration: 0.2 }] }, 8.87);
      slamIn('#t1', 8.88, 'scale');
      [2, 1, 0].forEach((h, i) => { tl.set('#hf' + h, { opacity: 0 }, 8.95 + i * 0.1); tl.set('#he' + h, { opacity: 1 }, 8.95 + i * 0.1); });
      counter(8.95, 9.45, 12, 0);
      tl.to('#t1', { opacity: 0, y: -60, duration: 0.15 }, 9.9);

      // ===== 10 : donne-la, on te vide =====
      [0, 1, 2].forEach(h => { tl.set('#hf' + h, { opacity: 1 }, 10.0); tl.set('#he' + h, { opacity: 0 }, 10.0); });
      showN(12, 10.0);
      tl.fromTo('#key', { opacity: 0, x: -407, y: -251, rotation: -12, scale: 0.3 }, { opacity: 1, scale: 1.35, duration: 0.2, ease: 'back.out(3)', immediateRender: false }, 10.0);
      tl.to('#cam-inner', { ...cam(640, 1480), duration: 0.35, ease: 'power3.inOut' }, 10.05);
      tl.to('#cam-outer', { scale: 1.1, rotation: 0, duration: 0.35, ease: 'power3.inOut' }, 10.05);
      tl.fromTo('#hacker', { opacity: 1, x: 500 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, 10.25);
      tl.to('#key', { x: 220, y: -120, scale: 1, rotation: 20, duration: 0.3, ease: 'power3.inOut' }, 10.6);
      tl.to('#lid', { y: -80, x: -40, rotation: -40, duration: 0.15, ease: 'power3.out' }, 10.95);
      document.querySelectorAll('.sc').forEach((c, i) => tl.fromTo(c, { opacity: 1, x: 0, y: 0 }, { opacity: 1, x: +c.dataset.x, y: +c.dataset.y, duration: 0.7, ease: 'power2.out', immediateRender: false }, 10.95 + i * 0.035));
      tl.to('.sc', { opacity: 0, duration: 0.2 }, 11.8);
      counter(10.97, 11.55, 12, 0);
      shake(10.97, 12);
      tl.to(['#hacker', '#key'], { x: '+=900', duration: 0.45, ease: 'power3.in' }, 11.62);

      // ===== 12,2 : et sur un exchange ? =====
      whip(12.15, 2470, 1420, 1.1, -2, 0.38);
      tl.fromTo('#castle', { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, transformOrigin: '50% 100%', duration: 0.32, ease: 'back.out(2)', immediateRender: false }, 12.4);
      tl.fromTo('#qblock', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, 12.5);
      tl.to('#qblock', { keyframes: [{ y: -40, duration: 0.08 }, { y: 0, duration: 0.12, ease: 'power2.in' }] }, 12.72);
      tl.set('#bars', { y: -190 }, 12.0);

      // ===== 14,2 : c'est eux qui gardent la clé, pas toi =====
      tl.fromTo('#key2', { opacity: 1, x: -400, y: -150, rotation: -40 }, { opacity: 1, x: 400, y: 250, rotation: 20, duration: 0.55, ease: 'power2.inOut', immediateRender: false }, 14.3);
      tl.to('#key2', { x: 470, y: 320, scale: 0.3, opacity: 0, duration: 0.15 }, 14.85);
      tl.to('#bars', { y: 0, duration: 0.14, ease: 'power4.in' }, 14.98);
      playBurst(burstGate, 15.12);
      shake(15.12, 14);
      tl.fromTo('#punk2', { opacity: 1, x: -300 }, { opacity: 1, x: 260, duration: 0.42, ease: 'none', immediateRender: false }, 15.12);
      walk('#punk2', 15.12, 15.54);
      tl.to('#punk2', { keyframes: [{ x: 200, y: -50, duration: 0.12, ease: 'power2.out' }, { x: 170, y: 0, duration: 0.14, ease: 'power2.in' }] }, 15.55);
      tl.fromTo('#xb', { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(3)', immediateRender: false }, 15.6);

      // ===== 16,7 : pas tes clés, pas tes cryptos =====
      tl.to('#dim', { opacity: 1, duration: 0.2 }, 16.6);
      tl.to('#xb', { opacity: 0, duration: 0.15 }, 16.55);
      tl.to('#cam-outer', { scale: 1.3, duration: 2.2, ease: 'power1.in' }, 16.6);
      slamIn('#p1', 16.82, -1);
      slamIn('#p2', 17.66, 'scale');
      tl.to('#root', { keyframes: [{ scale: 1.07, duration: 0.06 }, { scale: 1, duration: 0.28, ease: 'power3.out' }] }, 17.7);

      // ===== 19 : écran de fin =====
      tl.to('#flash', { keyframes: [{ opacity: 0.9, duration: 0.04 }, { opacity: 0, duration: 0.3 }] }, 18.95);
      tl.set(['#cam-outer', '#p1', '#p2', '#hud'], { opacity: 0 }, 19.0);
      tl.set('#end', { opacity: 1 }, 19.0);
      tl.fromTo('#endPunk', { scale: 0.3, rotation: -14 }, { scale: 1, rotation: -3, duration: 0.4, ease: 'back.out(2.2)', immediateRender: false }, 19.0);
      for (let t = 19.5, i = 0; t < 22.4; t += 0.25, i++) tl.set('#endPunk', { y: i % 2 ? -10 : 0 }, t);
      slamIn('#e0', 19.05, 'scale'); slamIn('#e1', 19.17, -1); slamIn('#e2', 19.69, 'scale');
      tl.set('#e3', { opacity: 1 }, 20.37); blink('#e3', 20.9, 5);
      tl.to({}, { duration: 0.01 }, 22.49);
      tl.seek(0);
    </script>
  </body>
</html>

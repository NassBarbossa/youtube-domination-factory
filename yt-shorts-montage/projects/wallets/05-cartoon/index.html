      [0, 1, 2].forEach(i => { tl.fromTo('#o' + i, { x: 320, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, wt('eux') + i * 0.08);
        tl.fromTo('#ox' + i, { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.14, ease: 'power3.out', immediateRender: false }, wt('décident') + i * 0.1);
        tl.to('#o' + i, { x: 520, y: -220, rotation: 90, opacity: 0, duration: 0.4, ease: 'power2.in' }, wt('décident') + 0.4 + i * 0.08); });
      tl.to('#bars', { y: 0, duration: 0.16, ease: 'power4.in' }, wt('mettent'));
      tl.to(P('pB', 'head'), { rotation: -8, duration: 0.15, yoyo: true, repeat: 1 }, wt('mettent') + 0.15);
      playBurst(bG, wt('mettent') + 0.14); shake(wt('mettent') + 0.14, 12);

      // ===== 3 · le Far West =====
      whip(PH[3] - 0.12, 3850, 1360, 1.0, -2, 0.44);
      walk('pC', PH[3] + 0.4, PH[3] + 1.5);
      tl.to('#sC', { x: 130, duration: 1.1, ease: 'none' }, PH[3] + 0.4);
      tl.fromTo('#dexSign', { opacity: 0, scale: 3 }, { opacity: 1, scale: 1, duration: 0.24, ease: 'back.out(2)', immediateRender: false }, wt('décentralisé') - 0.05);
      tl.to('#cam-outer', { scale: 0.8, duration: 0.5, ease: 'power3.inOut' }, PH[4] - 0.1);
      tl.to('#cam-inner', { ...cam(3950, 1300), duration: 0.5, ease: 'power3.inOut' }, PH[4] - 0.1);
      SX.forEach((_, i) => tl.fromTo('#sp' + i, { opacity: 1, y: 160, scale: 0.3 }, { opacity: 1, y: -40 - (i % 4) * 30, scale: 1, duration: 0.4, ease: 'back.out(2.5)', immediateRender: false }, wt('tout', PH[4]) + i * 0.08));
      SX.forEach((_, i) => coinSpin('#sp' + i + ' svg', wt('tout', PH[4]) + 0.45 + (i % 3) * 0.05, PH[6]));
      tl.to(P('pC', 'head'), { rotation: 8, duration: 0.25, yoyo: true, repeat: 3 }, wt('créer'));
      tl.fromTo('#tumble', { x: 4950, rotation: 0 }, { x: 3300, rotation: -900, duration: 2.4, ease: 'none', immediateRender: false }, PH[5] - 0.1);
      tl.fromTo('#wood', { opacity: 1, y: -800 }, { opacity: 1, y: 0, duration: 0.34, ease: 'bounce.out', immediateRender: false }, wt('far') - 0.22);
      playBurst(bW, wt('far') + 0.1); shake(wt('far') + 0.1, 16);
      slam('#kF', wt('far'), 'scale');
      tl.to('#kF', { opacity: 0, y: -60, duration: 0.15 }, PH[6] - 0.1);
      tl.to('.sp2', { opacity: 0, duration: 0.25 }, PH[6]);
      // équipé d'une méthode
      tl.to('#cam-outer', { scale: 1.25, rotation: 0, duration: 0.45, ease: 'power3.inOut' }, PH[6] - 0.1);
      tl.to('#cam-inner', { ...cam(3850, 1430), duration: 0.45, ease: 'power3.inOut' }, PH[6] - 0.1);
      tl.fromTo('#hat', { opacity: 1, y: -1000 }, { opacity: 1, y: -451, duration: 0.34, ease: 'bounce.out', immediateRender: false }, wt('équipé') - 0.28);
      tl.to(P('pC', 'body'), { keyframes: [{ scaleY: 0.92, duration: 0.06 }, { scaleY: 1, duration: 0.2, ease: 'back.out(3)' }] }, wt('équipé') + 0.06);
      tl.fromTo('#badge', { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, wt('méthode', PH[6]) - 0.05);
      armUp('pC', wt('méthode', PH[6]) - 0.05, 0.8);
      tl.fromTo('#raysC', { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: 60, duration: 0.55, ease: 'expo.out', immediateRender: false }, wt('méthode', PH[6]));
      tl.fromTo('#iocChip', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, wt('méthode', PH[6]) + 0.1);
      playBurst(bC, wt('méthode', PH[6]));
      tl.to(['#raysC', '#iocChip'], { opacity: 0, duration: 0.2 }, PH[7] - 0.2);

      // ===== 4 · se positionner avant tout le monde =====
      whip(PH[7] - 0.16, 4660, 1260, 1.0, 2, 0.42);
      tl.set('#sC', { x: 820, y: 0 }, PH[7] - 0.02);
      tl.set(['#stairs', '#nug2'], { opacity: 1 }, PH[7] - 0.02);
      coinSpin('#nug2 svg', PH[7], 31.4);
      [0, 1, 2].forEach(i => hop('#sC', 'pC', PH[7] + 0.3 + i * 0.42, 106, -96, 110));
      const IOC = wt('ioc');
      armUp('pC', IOC - 0.1);
      tl.to('#nug2', { y: 70, x: 95, duration: 0.22, ease: 'power3.out' }, IOC);
      tl.fromTo('#raysD', { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: 80, duration: 0.6, ease: 'expo.out', immediateRender: false }, IOC);
      playBurst(bD, IOC); shake(IOC, 12);
      slam('#kI1', IOC - 0.3, -1); slam('#kI2', IOC, 'scale');
      tl.to(['#kI1', '#kI2'], { opacity: 0, y: -60, duration: 0.15 }, wt('avant', 28) - 0.1);
      tl.to('#cam-outer', { scale: 0.78, duration: 0.6, ease: 'power3.inOut' }, wt('avant', 28) - 0.1);
      tl.to('#cam-inner', { ...cam(4380, 1260), duration: 0.6, ease: 'power3.inOut' }, wt('avant', 28) - 0.1);
      [0, 1, 2, 3].forEach(i => { const t = wt('tout', 29) - 0.45 + i * 0.06; tl.set('#ms' + i, { opacity: 1 }, t); tl.fromTo('#ms' + i, { x: -700 }, { x: 0, duration: 0.9, ease: 'power1.out', immediateRender: false }, t); walk('m' + i, t, t + 0.9, 0.32, 30);
        tl.fromTo('#mx' + i, { opacity: 0, y: 30, scale: 0.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: 'back.out(3)', immediateRender: false }, wt('courant') + i * 0.06);
        tl.to(P('m' + i, 'head'), { rotation: -10, duration: 0.15 }, wt('courant') + i * 0.06); });

      // ===== fin =====
      const END = VEND + 0.05;
      tl.to('#flash', { keyframes: [{ opacity: 0.9, duration: 0.04 }, { opacity: 0, duration: 0.3 }] }, END - 0.05);
      tl.set('#cam-outer', { opacity: 0 }, END);
      tl.set('#end', { opacity: 1 }, END);
      tl.fromTo('#sE', { scale: 0.3, y: 120 }, { scale: 1, y: 0, duration: 0.45, ease: 'back.out(2)', immediateRender: false }, END);
      armUp('pE', END + 0.35); puff('pE', END + 0.8); blink('pE', END + 1.6);
      tl.fromTo('#hatE', { y: -500 }, { y: -250, duration: 0.35, ease: 'bounce.out', immediateRender: false }, END + 0.2);
      slam('#e1', END + 0.25, -1); slam('#e2', END + 0.6, 'scale');
      tl.fromTo('#e3', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.5)', immediateRender: false }, END + 1.1);
      tl.to('#e3', { scale: 1.06, duration: 0.3, yoyo: true, repeat: 3, ease: 'sine.inOut' }, END + 1.5);
      tl.to({}, { duration: 0.01 }, 34.39);
      tl.seek(0);

<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F2EFE8; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: #F2EFE8;
        background-image: linear-gradient(#E6E1D6 1px, transparent 1px), linear-gradient(90deg, #E6E1D6 1px, transparent 1px);
        background-size: 96px 96px; background-position: -12px -12px; }
    </style>
  </head>
  <body>
    <!-- Short 08 « L'or est en solde » — Convergence EP.03, concept « Les deux droites ». Voix réelles de Sadek et Nass, pas de musique. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="44.0" data-width="1080" data-height="1920" data-fps="60" data-motion-blur="on">
      <div id="ground"></div>
      <div id="stage" data-composition-id="stage" data-composition-src="compositions/stage.html" data-start="0" data-duration="44.0"
           data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0"
           data-duration="39.85" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <audio id="voice" class="clip" src="assets/audio/voice.wav" data-start="0" data-volume="1" data-track-index="4"></audio>
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh-short-n.wav" data-start="2.235" data-volume="0.34" data-track-index="5"></audio>
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop-n.wav" data-start="7.145" data-volume="0.3" data-track-index="6"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh-n.wav" data-start="13.04" data-volume="0.3" data-track-index="7"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1-n.wav" data-start="40.55" data-volume="0.4" data-track-index="8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
